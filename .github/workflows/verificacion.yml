# Verificación automática (Fase 5 de la guía SDD): en cada cambio se revisan
# el contrato, la sincronía contrato ↔ código, las pruebas unitarias y las de aceptación.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrato-y-unitarias:
    name: Contrato y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint del contrato + sincronía de esquemas + pruebas unitarias
        run: npm run verify

  aceptacion:
    name: Pruebas de aceptación (escritorio y móvil)
    runs-on: ubuntu-latest
    needs: contrato-y-unitarias
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14

  supabase:
    name: Reglas de seguridad de Supabase (Postgres + PostgREST)
    runs-on: ubuntu-latest
    needs: contrato-y-unitarias
    env:
      POSTGREST_VERSION: v12.2.3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Descargar PostgREST
        run: |
          curl -fsSL -o postgrest.tar.xz "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          mkdir -p "$HOME/bin" && tar -xJf postgrest.tar.xz -C "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Levantar Supabase local con supabase/esquema.sql
        run: bash scripts/supabase-local.sh iniciar >> "$GITHUB_ENV"
      - name: Pruebas de integración (la base protege los datos)
        run: npm run test:integracion
      - name: Pruebas en navegador en modo Supabase
        run: npx playwright test tests/supabase.spec.js
      - name: Guardar reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright-supabase
          path: playwright-report/
          retention-days: 14
